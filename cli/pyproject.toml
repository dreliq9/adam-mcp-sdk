[project]
name = "adam-mcp-cli"
version = "0.2.2"
description = "CLI for the Adam MCP house style"
requires-python = ">=3.11"
dependencies = [
    "adam-mcp-py==0.3.2",
    "typer>=0.12",
    "jinja2>=3.1",
    "tomlkit>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
adam-mcp = "adam_mcp_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adam_mcp_cli"]

[tool.uv.sources]
adam-mcp-py = { workspace = true }
