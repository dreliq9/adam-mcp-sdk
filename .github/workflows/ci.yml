name: CI

on:
  push:
    branches: [main]
    tags: ["v*", "cli-v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync deps (all extras)
        run: uv sync --all-extras --python ${{ matrix.python-version }}

      - name: python/ tests
        run: uv run python -m pytest python/tests/ -q

      - name: cli/ tests
        run: uv run python -m pytest cli/tests/ -q

      - name: claude-pack/ tests
        run: uv run python -m pytest claude-pack/tests/ -q

      - name: reference-mcp tests
        run: uv run python -m pytest reference-mcp/adam-greet/tests/ -q

      - name: audit --self-check
        run: uv run --project python adam-mcp audit --self-check

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-extras
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .

  build:
    name: build wheel + sdist (adam-mcp-py)
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - name: Build python/
        run: uv build --package adam-mcp-py
      - name: Validate distributions
        run: uvx --from twine twine check --strict dist/*
      - name: Smoke-test installed wheel
        shell: bash
        run: |
          wheel=$(find dist -name '*.whl' -print -quit)
          uv run --isolated --no-project --with "$wheel" python - <<'PY'
          import asyncio
          from importlib.metadata import version

          from adam_mcp_py import BaseServer, Result, validates
          from mcp import Client
          from pydantic import BaseModel

          class Input(BaseModel):
              value: int

          @validates(Input)
          async def double(input: Input) -> Result[int]:
              return Result.ok(value=input.value * 2)

          assert version("adam-mcp-py") == "0.3.3"
          assert version("mcp") == "2.0.0"
          assert Result.ok(value=7).value == 7
          assert asyncio.run(double({"value": 6})).value == 12

          async def protocol_smoke() -> None:
              server = BaseServer("wheel-smoke")

              @server.tool()
              def add(a: int, b: int) -> Result[int]:
                  return Result.ok(value=a + b)

              async with Client(server.mcp_server) as client:
                  result = await client.call_tool("add", {"a": 2, "b": 3})
              assert result.structured_content["value"] == 5

          asyncio.run(protocol_smoke())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  build-cli:
    name: build + smoke test (adam-mcp-cli)
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - name: Build cli/ and its unreleased library dependency
        run: |
          uv build --package adam-mcp-py --out-dir dist-cli-deps
          uv build --package adam-mcp-cli --out-dir dist-cli
      - name: Validate distributions
        run: |
          uvx --from twine twine check --strict dist-cli/*
          uvx --from twine twine check --strict dist-cli-deps/*
      - name: Smoke-test installed wheel
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(find dist-cli -name '*.whl' -print -quit)
          libwheel=$(find dist-cli-deps -name '*.whl' -print -quit)
          target=$(mktemp -d)/example-mcp
          outside=$(mktemp -d)

          run_cli() {
            uv run --isolated --no-project --with "$libwheel" --with "$wheel" "$@"
          }

          run_cli adam-mcp --help
          run_cli adam-mcp new example-mcp --description "wheel smoke test" --target "$target"
          test -f "$target/example_mcp/mcp/server.py"
          grep -F '"adam-mcp-py==0.3.3"' "$target/pyproject.toml"
          grep -F '"mcp==2.0.0"' "$target/pyproject.toml"
          run_cli adam-mcp audit "$target"
          run_cli adam-mcp upgrade "$target" --to 0.3.3 --dry-run

          set +e
          output=$(run_cli adam-mcp audit "$outside" --self-check 2>&1)
          status=$?
          set -e
          test "$status" -eq 1
          grep -F "adam-mcp-sdk checkout" <<<"$output"
          ! grep -F "Traceback" <<<"$output"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-cli
          path: dist-cli/
