[project]
name = "adam-mcp-py"
version = "0.2.1"
description = "Python primitives for the Adam MCP house style"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adam_mcp_py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
