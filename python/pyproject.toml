[project]
name = "adam-mcp-py"
version = "0.3.3"
description = "Python primitives for the Adam MCP house style — typed Result envelope, comptime-style validation wrappers, escape hatches by default."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Adam Steen", email = "108751318+dreliq9@users.noreply.github.com" }]
keywords = ["mcp", "model-context-protocol", "sdk", "ai-tools", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp==2.0.0",
    "pydantic>=2.5",
]

[project.urls]
Homepage = "https://github.com/dreliq9/adam-mcp-sdk"
Repository = "https://github.com/dreliq9/adam-mcp-sdk"
Issues = "https://github.com/dreliq9/adam-mcp-sdk/issues"
Changelog = "https://github.com/dreliq9/adam-mcp-sdk/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adam_mcp_py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
