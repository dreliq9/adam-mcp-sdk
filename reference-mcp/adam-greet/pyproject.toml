[project]
name = "adam-greet"
version = "0.1.0"
description = "Reference MCP for the Adam house style — context-aware morning greeting"
requires-python = ">=3.11"
dependencies = [
    "adam-mcp-py==0.3.2",
    "mcp==1.28.1",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
adam-greet = "adam_greet.cli:main"
adam-greet-mcp = "adam_greet.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adam_greet"]

[tool.uv.sources]
adam-mcp-py = { workspace = true }
